# Gitleaks config — extends the default ruleset.
# .env.example documents variable NAMES only (no real values) and is required
# by SETUP-01 to be committed; the generic-api-key rule false-positives on
# lines like `PAYMOB_HMAC_SECRET=`.
[extend]
useDefault = true

[allowlist]
description = "Documented placeholder env files — never contain real values"
paths = ['''\.env\.example$''']
