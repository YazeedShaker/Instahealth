name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # ────────────────────────────────────────────────
  # 1. Install & cache — all other jobs depend on this
  # ────────────────────────────────────────────────
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from packageManager in package.json — do not also pin here
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ────────────────────────────────────────────────
  # 2. Lint — ESLint, fails on warnings
  # ────────────────────────────────────────────────
  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ESLint (zero warnings allowed)
        # --max-warnings=0 is baked into each workspace's lint script
        run: pnpm turbo lint
      - name: Prettier check
        run: pnpm format:check

  # ────────────────────────────────────────────────
  # 3. Typecheck — strict, no `any`
  # ────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: TypeScript strict check
        run: pnpm turbo typecheck

  # ────────────────────────────────────────────────
  # 4. Unit tests — Vitest (business logic coverage)
  # ────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Vitest with coverage
        # --coverage is baked into workspace test:unit scripts where tests exist
        run: pnpm turbo test:unit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/
          retention-days: 7
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # 5. Build — web builds clean, mobile bundles clean
  # ────────────────────────────────────────────────
  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build all apps & packages
        run: pnpm turbo build
        env:
          # Dummy values for build-time — real values in Vercel / EAS
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: apps/web/.next/
          retention-days: 1

  # ────────────────────────────────────────────────
  # 6a. Web E2E — Playwright (dashboard/admin flows)
  # ────────────────────────────────────────────────
  e2e-web:
    name: E2E Web (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ⚠ ONE E2E RUN AT A TIME, REPO-WIDE. The workflow-level `concurrency` above
    # is keyed on `github.ref`, which correctly cancels superseded runs of the
    # SAME branch — but does nothing across branches, and this job seeds and then
    # CONSUMES a shared dev database. A push to main and a PR run therefore
    # overlapped and ate each other's fixtures: measured 2026-08-01, main's E2E
    # ran 13:32:59–13:36:29 while a PR's started 13:37:50 and found ONE
    # actionable booking where four had just been seeded.
    #
    # `cancel-in-progress: false` so they QUEUE rather than cancel — cancelling
    # main's verification because a PR arrived would be exactly backwards. The
    # cost is that E2E serialises repo-wide; the suite is ~2 minutes, which is a
    # bargain for a deterministic fixture state. `timeout-minutes` is there so a
    # wedged run cannot hold the queue.
    concurrency:
      group: e2e-web-shared-dev-database
      cancel-in-progress: false
    # Job-level, because the `secrets` context is NOT available in a step `if`
    # and a step's OWN `env:` is not in scope for that step's `if` either. This
    # is the only placement where `env.SUPABASE_DB_URL` actually resolves.
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # ⚠ SEED BEFORE THE SUITE. The dashboard E2E MUTATES the data it tests —
      # it marks a booking completed, cancels another — so the day drains after
      # a few runs and every count-guarded test starts skipping itself. That is
      # not hypothetical: CI reported "24 passed, 9 skipped" for two days while
      # the outcome workflow was not being exercised at all, which is how the
      # swallowed-completion bug survived. 004 RESETS the day (it does not
      # append), so running it every time is idempotent and cheap.
      #
      # ⚠ BLOCKING. It was `continue-on-error` while SUPABASE_DB_URL pointed at
      # the direct (IPv6-only) host and could never connect — correct then,
      # because an unreachable database must not turn every PR red for a reason
      # unrelated to the change under review. The secret is now the Session
      # pooler URL and seeding works, so the tolerance is gone: a seed that
      # silently fails is a scanner nobody is waiting on, and the FIXTURE
      # TRIPWIRE would then report the drained day pointing at the wrong cause.
      #
      # If the secret is ever UNSET the step is skipped and the tripwire fails
      # loudly instead — one clear red beats nine quiet skips either way.
      #
      # ⚠ SUPABASE_DB_URL MUST BE THE SESSION POOLER URL. The direct host
      # `db.<ref>.supabase.co` resolves to IPv6 only and GitHub runners have no
      # IPv6 route. Get it from the dashboard's **Connect** button → Session
      # pooler (`aws-<n>-<region>.pooler.supabase.com:5432`); the username there
      # is `postgres.<project-ref>`, not plain `postgres`.
      - name: Seed dashboard E2E fixtures
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seeds/004_dashboard_e2e_fixtures.sql || {
            echo "::error::Fixture seeding failed. If this says 'Network is unreachable', SUPABASE_DB_URL is the DIRECT (IPv6-only) host — switch the secret to the Session pooler URL."
            exit 1
          }
      - name: Run Playwright
        run: pnpm turbo test:e2e --filter=@instahealth/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          # Provider dashboard suite (P01). Until these repo secrets exist the
          # credential-dependent tests SKIP rather than fail — see
          # apps/web/e2e/dashboard.spec.ts.
          PROVIDER_TEST_EMAIL: ${{ secrets.PROVIDER_TEST_EMAIL }}
          PROVIDER_TEST_PASSWORD: ${{ secrets.PROVIDER_TEST_PASSWORD }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────
  # 6b. Mobile E2E — Maestro (patient flows)
  # Runs on macOS with an iOS simulator + Expo dev build.
  # ────────────────────────────────────────────────
  e2e-mobile:
    name: E2E Mobile (Maestro)
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Build Expo dev client (iOS simulator)
        run: pnpm --filter=@instahealth/mobile exec expo prebuild --platform ios --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      - name: Run Maestro smoke flows
        run: |
          export PATH="$PATH":"$HOME/.maestro/bin"
          pnpm --filter=@instahealth/mobile test:e2e

  # ────────────────────────────────────────────────
  # 7. All-green gate — required check for merge
  # ────────────────────────────────────────────────
  ci-passed:
    name: CI Passed
    if: always()
    needs: [lint, typecheck, unit-tests, build, e2e-web, e2e-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        # skipped/cancelled upstream jobs must also block the merge — a skipped
        # pipeline is not a green pipeline
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more CI jobs failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All CI checks passed."
