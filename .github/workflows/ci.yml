name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # ────────────────────────────────────────────────
  # 1. Install & cache — all other jobs depend on this
  # ────────────────────────────────────────────────
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from packageManager in package.json — do not also pin here
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ────────────────────────────────────────────────
  # 2. Lint — ESLint, fails on warnings
  # ────────────────────────────────────────────────
  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ESLint (zero warnings allowed)
        # --max-warnings=0 is baked into each workspace's lint script
        run: pnpm turbo lint
      - name: Prettier check
        run: pnpm format:check

  # ────────────────────────────────────────────────
  # 3. Typecheck — strict, no `any`
  # ────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: TypeScript strict check
        run: pnpm turbo typecheck

  # ────────────────────────────────────────────────
  # 4. Unit tests — Vitest (business logic coverage)
  # ────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Vitest with coverage
        # --coverage is baked into workspace test:unit scripts where tests exist
        run: pnpm turbo test:unit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/
          retention-days: 7
          if-no-files-found: warn

  # ────────────────────────────────────────────────
  # 5. Build — web builds clean, mobile bundles clean
  # ────────────────────────────────────────────────
  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build all apps & packages
        run: pnpm turbo build
        env:
          # Dummy values for build-time — real values in Vercel / EAS
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: apps/web/.next/
          retention-days: 1

  # ────────────────────────────────────────────────
  # 6a. Web E2E — Playwright (dashboard/admin flows)
  # ────────────────────────────────────────────────
  e2e-web:
    name: E2E Web (Playwright)
    needs: build
    runs-on: ubuntu-latest
    # Job-level, because the `secrets` context is NOT available in a step `if`
    # and a step's OWN `env:` is not in scope for that step's `if` either. This
    # is the only placement where `env.SUPABASE_DB_URL` actually resolves.
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # ⚠ SEED BEFORE THE SUITE. The dashboard E2E MUTATES the data it tests —
      # it marks a booking completed, cancels another — so the day drains after
      # a few runs and every count-guarded test starts skipping itself. That is
      # not hypothetical: CI reported "24 passed, 9 skipped" for two days while
      # the outcome workflow was not being exercised at all, which is how the
      # swallowed-completion bug survived. 004 RESETS the day (it does not
      # append), so running it every time is idempotent and cheap.
      #
      # Needs SUPABASE_DB_URL as a repo secret. Until it exists this step is
      # skipped and the FIXTURE TRIPWIRE test in dashboard.spec.ts fails loudly
      # instead — one clear red beats nine quiet skips either way.
      # ⚠ NON-BLOCKING ON PURPOSE. Seeding is an optimisation; the FIXTURE
      # TRIPWIRE in dashboard.spec.ts is the actual guard, and it names this step
      # in its failure message. An unreachable database must not turn every PR
      # red for a reason that has nothing to do with the change under review.
      #
      # ⚠ SUPABASE_DB_URL MUST BE THE POOLER URL, NOT THE DIRECT ONE. The direct
      # host `db.<ref>.supabase.co` now resolves to IPv6 only, and GitHub runners
      # have no IPv6 route — psql fails with "Network is unreachable". Use the
      # Session pooler string from Supabase → Project Settings → Database
      # (`aws-0-<region>.pooler.supabase.com`), which is IPv4.
      - name: Seed dashboard E2E fixtures
        if: ${{ env.SUPABASE_DB_URL != '' }}
        continue-on-error: true
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seeds/004_dashboard_e2e_fixtures.sql \
            || echo "::warning::Fixture seeding failed — if this is 'Network is unreachable', SUPABASE_DB_URL is the DIRECT (IPv6-only) host; switch the secret to the Session pooler URL. The FIXTURE TRIPWIRE will report if the day has actually drained."
      - name: Run Playwright
        run: pnpm turbo test:e2e --filter=@instahealth/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          # Provider dashboard suite (P01). Until these repo secrets exist the
          # credential-dependent tests SKIP rather than fail — see
          # apps/web/e2e/dashboard.spec.ts.
          PROVIDER_TEST_EMAIL: ${{ secrets.PROVIDER_TEST_EMAIL }}
          PROVIDER_TEST_PASSWORD: ${{ secrets.PROVIDER_TEST_PASSWORD }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────
  # 6b. Mobile E2E — Maestro (patient flows)
  # Runs on macOS with an iOS simulator + Expo dev build.
  # ────────────────────────────────────────────────
  e2e-mobile:
    name: E2E Mobile (Maestro)
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Build Expo dev client (iOS simulator)
        run: pnpm --filter=@instahealth/mobile exec expo prebuild --platform ios --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      - name: Run Maestro smoke flows
        run: |
          export PATH="$PATH":"$HOME/.maestro/bin"
          pnpm --filter=@instahealth/mobile test:e2e

  # ────────────────────────────────────────────────
  # 7. All-green gate — required check for merge
  # ────────────────────────────────────────────────
  ci-passed:
    name: CI Passed
    if: always()
    needs: [lint, typecheck, unit-tests, build, e2e-web, e2e-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        # skipped/cancelled upstream jobs must also block the merge — a skipped
        # pipeline is not a green pipeline
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more CI jobs failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All CI checks passed."
